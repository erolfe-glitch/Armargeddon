:root { --bg: #221B18; --panel: #322923; --panel2: #2a221d; --rust: #66483A; --text: #F0EDE1; --parch: #BBA583; --brass: #C2A461; --life: #8E2B22; --friend: #7D8471; --ink: #120D0B; --dim: #b9ad97; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }

h1 { margin: 0; font: 700 21px Georgia, "Times New Roman", serif; letter-spacing: .06em; text-transform: uppercase; }

button, select { font: inherit; color: var(--text); background: #3d322a; border: 2px solid var(--rust); border-radius: 6px; min-height: 44px; padding: 6px 12px; box-shadow: 0 2px 0 var(--ink); cursor: pointer; }
button:active, button.an { background: #5a4630; border-color: var(--brass); }
button:disabled, select:disabled { opacity: .45; cursor: default; }
.gold { background: var(--brass); color: var(--ink); border-color: var(--ink); font-weight: 700; }
.gold:active { background: #d8bb76; }
.wrap { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; padding: 14px 16px 60px; align-items: start; }

.tabs button.A.an { border-color: var(--life); background: #5b2a22; } .tabs button.D.an { border-color: var(--friend); background: #4a4a3e; }
.kat { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }

main { min-width: 0; }

.p .ti { font-weight: 700; } .p .ti .tag { font-weight: 400; font-size: 12px; color: var(--ink); background: var(--parch); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }

.p .hin { grid-column: 2 / -1; }

.p select { width: 100%; min-width: 0; }
.r { display: block; font-size: 13px; color: var(--dim); } .r b { color: var(--text); font-variant-numeric: tabular-nums; }
.r input { width: 100%; accent-color: var(--brass); height: 30px; margin: 0; }

.leer { color: var(--dim); padding: 40px; text-align: center; }

dialog::backdrop { background: rgba(18, 13, 11, .7); }
dialog h2 { margin: 0 0 6px; font: 700 20px Georgia, serif; }
dialog textarea { width: 100%; height: 46vh; background: #1a1411; color: var(--text); border: 1px solid var(--rust); border-radius: 4px; font: 13px ui-monospace, Consolas, monospace; padding: 8px; }
.dlgk { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 8px; }
@media (max-width: 1100px) { .p { grid-template-columns: 50px minmax(0, 1fr) 44px; } .p select, .p .r { grid-column: 2 / 3; } .p .x { grid-column: 3; grid-row: 1; } .p .hin { grid-column: 2 / 3; } }
