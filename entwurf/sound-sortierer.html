<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound-Sortierer</title>
<style>
/* Palette und Schrift aus STYLE.md */
:root {
  --s-bg: #221B18; --s-panel: #322923; --s-rust: #66483A; --s-text: #F0EDE1; --s-parch: #BBA583;
  --s-brass: #C2A461; --s-life: #BF4638; --s-foe-dark: #713B36; --s-friend: #7A8F99; --s-gas: #8A8A2E; --s-ink: #120D0B;
  --s-head: "Bahnschrift SemiBold Condensed", "Bahnschrift", "DIN Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --s-body: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --dim: #a99c86;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--s-bg); color: var(--s-text); font: 16px/1.35 var(--s-body); }
header { position: sticky; top: 0; z-index: 5; background: var(--s-panel); border-bottom: 3px solid var(--s-rust); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
h1 { margin: 0 10px 0 0; font: 600 26px var(--s-head); letter-spacing: .08em; text-transform: uppercase; color: var(--s-brass); }
button, select, input { font: inherit; color: var(--s-text); background: var(--s-bg); border: 2px solid var(--s-rust); border-radius: 3px; min-height: 44px; }
button { font: 600 16px var(--s-head); letter-spacing: .06em; text-transform: uppercase; padding: 0 14px; cursor: pointer; }
button:hover, select:hover { border-color: var(--s-brass); }
button.gold { background: var(--s-brass); color: var(--s-ink); border-color: var(--s-ink); box-shadow: 0 2px 0 var(--s-ink); }
select { padding: 0 8px; }
input[type=search] { padding: 0 10px; width: 220px; }
label.chk { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; cursor: pointer; }
label.chk input { width: 22px; height: 22px; min-height: 0; }
.stat { color: var(--dim); font-size: 15px; margin-left: auto; }
.stat b { color: var(--s-brass); }
main { padding: 8px 16px 60px; }
.grp { margin: 18px 0 6px; font: 600 18px var(--s-head); letter-spacing: .08em; text-transform: uppercase; color: var(--s-parch); border-bottom: 1px solid var(--s-rust); padding-bottom: 3px; }
.row { display: grid; grid-template-columns: 56px minmax(260px, 1fr) 92px 230px minmax(160px, 260px); gap: 6px 12px; align-items: center; padding: 8px 10px; border-radius: 4px; background: rgba(50,41,35,.55); margin: 5px 0; border-left: 5px solid transparent; }
.row.chg { border-left-color: var(--s-brass); }
.row.bad { border-left-color: var(--s-life); background: rgba(113,59,54,.35); }
.row.play { outline: 2px solid var(--s-brass); }
.pl { width: 52px; height: 52px; font-size: 22px; padding: 0; }
.row.play .pl { background: var(--s-brass); color: var(--s-ink); }
.nm { min-width: 0; }
.nm .f { font-weight: 600; overflow-wrap: anywhere; }
.nm .d { color: var(--dim); font-size: 14px; }
.nm .src { font-size: 14px; color: var(--dim); }
.nm .src a { color: var(--s-friend); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.tag { font: 600 13px var(--s-head); letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; background: var(--s-rust); color: var(--s-text); }
.tag.rot { background: var(--s-life); }
.tag.gelb { background: var(--s-gas); }
.len { text-align: right; font: 600 18px var(--s-head); }
.len small { display: block; font: 13px var(--s-body); color: var(--dim); }
.cat select { width: 100%; }
.cat .vs { font-size: 13px; color: var(--dim); margin-top: 2px; }
.note input { width: 100%; padding: 0 8px; }
.prog { grid-column: 2 / -1; height: 4px; background: var(--s-ink); border-radius: 2px; display: none; }
.row.play .prog { display: block; }
.prog i { display: block; height: 100%; width: 0; background: var(--s-brass); }
.leer { color: var(--dim); padding: 30px; text-align: center; }
.hilfe { color: var(--dim); font-size: 15px; margin: 6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Sound-Sortierer</h1>
  <input type="search" id="q" placeholder="Suchen …" aria-label="Suchen">
  <select id="fcat" aria-label="Kategorie filtern"><option value="">Alle Kategorien</option></select>
  <select id="sort" aria-label="Ordnen nach">
    <option value="ordner">nach Ordner</option>
    <option value="kat">nach Kategorie</option>
    <option value="len">nach Länge</option>
  </select>
  <label class="chk"><input type="checkbox" id="fhint"> nur mit Hinweis</label>
  <label class="chk"><input type="checkbox" id="auto"> nächste nach Ende</label>
  <button class="gold" id="save">Liste speichern</button>
  <button id="reset" title="Alle Auswahlen und Notizen auf den Vorschlag zurücksetzen">Zurücksetzen</button>
  <span class="stat" id="stat"></span>
</header>
<main>
  <p class="hilfe">Vorauswahl = Vorschlag aus Dateiname, Ordner, Länge und Lautstärke. Geänderte Zeilen haben links einen goldenen Rand. Alles wird im Browser gespeichert; „Liste speichern“ lädt die Liste als JSON herunter.</p>
  <div id="list"></div>
</main>
<audio id="au" preload="none"></audio>

// Quelle aus dem Dateinamen
function quelle(name) {
  let m = name.match(/^(\d+)__(.+?)__/);
  if (m) return { text: 'Freesound #' + m[1] + ' (' + m[2] + ')', url: 'https://freesound.org/s/' + m[1] + '/', anbieter: 'Freesound', id: m[1], urheber: m[2] };
  m = name.match(/^mixkit-.*-(\d+)\.\w+$/);
  if (m) return { text: 'Mixkit #' + m[1], url: '', anbieter: 'Mixkit', id: m[1] };
  m = name.match(/^([a-z0-9_]+(?:-[a-z0-9_]+)*?)-.*-(\d{4,6})\.\w+$/i);
  if (m && !/\s/.test(name)) {
    const urh = name.match(/^(dragon-studio|the-vampires|[^-]+)-/)[1];
    return { text: 'Pixabay #' + m[2] + ' (' + urh + ')', url: '', anbieter: 'Pixabay', id: m[2], urheber: urh };
  }
  return { text: 'Quelle unbekannt', url: '', anbieter: 'unbekannt' };
}

const MESS = window.SOUND_MESS || {};
const FILES = Object.keys(MESS).map(p => {
  const i = p.lastIndexOf('/');
  const name = i < 0 ? p : p.slice(i + 1), dir = i < 0 ? '(Hauptordner)' : p.slice(0, i);
  const m = MESS[p], v = VS[name] || (dir === 'Monster' ? ['Dämonen (später)', 'Monster/Kreatur'] : ['Aussortiert', 'kein Vorschlag']);
  const hints = [];
  if (/seven-nation-army/i.test(name)) hints.push(['nicht verwendbar – geschützter Song', 'rot']);
  if (m.size > 5e6) hints.push(['zu groß (' + (m.size / 1e6).toFixed(1).replace('.', ',') + ' MB)', 'rot']);
  if (/\.aiff?$/i.test(name)) hints.push(['spielt im Browser nicht (AIFF)', 'rot']);
  if (m.dur > 20) hints.push(['lang – Ausschnitt nötig', 'gelb']);
  if (m.peak != null && m.peak < -15) hints.push(['leise', 'gelb']);
  if (m.peak != null && m.peak > 0.5) hints.push(['übersteuert?', 'gelb']);
  if (m.start != null && m.start >= 0.5) hints.push(['Stille am Anfang (' + m.start.toFixed(1).replace('.', ',') + ' s)', 'gelb']);
  return { path: p, name, dir, m, vs: v[0], grund: v[1], q: quelle(name), hints };
});

// gespeicherte Auswahl
const KEY = 'armargeddon.soundsortierer.v1';
let ST = {};
try { ST = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { ST = {}; }
function store() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
const catOf = f => (ST[f.path] && ST[f.path].cat) || f.vs;
const noteOf = f => (ST[f.path] && ST[f.path].note) || '';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtLen = s => s >= 60 ? Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') + ' min' : s.toFixed(1).replace('.', ',') + ' s';
const optHtml = KATS.map(k => `<option>${esc(k)}</option>`).join('');
$('fcat').insertAdjacentHTML('beforeend', KATS.map(k => `<option>${esc(k)}</option>`).join(''));

function render() {
  const q = $('q').value.trim().toLowerCase(), fc = $('fcat').value, fh = $('fhint').checked, so = $('sort').value;
  let list = FILES.filter(f => (!q || f.path.toLowerCase().includes(q) || noteOf(f).toLowerCase().includes(q))
    && (!fc || catOf(f) === fc) && (!fh || f.hints.length));
  const gkey = so === 'kat' ? catOf : so === 'ordner' ? (f => f.dir) : (() => '');
  if (so === 'kat') list.sort((a, b) => KATS.indexOf(catOf(a)) - KATS.indexOf(catOf(b)) || a.path.localeCompare(b.path, 'de'));
  else if (so === 'len') list.sort((a, b) => a.m.dur - b.m.dur);
  else list.sort((a, b) => (a.dir === '(Hauptordner)' ? -1 : 0) - (b.dir === '(Hauptordner)' ? -1 : 0) || a.dir.localeCompare(b.dir, 'de') || a.name.localeCompare(b.name, 'de'));
  let html = '', last = null;
  for (const f of list) {
    const g = gkey(f);
    if (g && g !== last) { html += `<div class="grp">${esc(g)}</div>`; last = g; }
    const cat = catOf(f), chg = cat !== f.vs || noteOf(f);
    const bad = f.hints.some(h => h[1] === 'rot');
    const tags = f.hints.map(h => `<span class="tag ${h[1]}">${esc(h[0])}</span>`).join('');
    const src = f.q.url ? `<a href="${f.q.url}" target="_blank" rel="noopener">${esc(f.q.text)}</a>` : esc(f.q.text);
    const lvl = f.m.peak == null ? 'nicht gemessen' : `Spitze ${f.m.peak} dB · Mittel ${f.m.rms} dB`;
    html += `<div class="row${chg ? ' chg' : ''}${bad ? ' bad' : ''}${playing === f.path ? ' play' : ''}" data-p="${esc(f.path)}">
      <button class="pl" aria-label="Abspielen">${playing === f.path ? '■' : '▶'}</button>
      <div class="nm"><div class="f">${esc(f.name)}</div><div class="d">${esc(f.dir)}</div><div class="src">${src}</div>${tags ? `<div class="tags">${tags}</div>` : ''}</div>
      <div class="len">${fmtLen(f.m.dur)}<small>${(f.m.size / 1e6).toFixed(1).replace('.', ',')} MB</small></div>
      <div class="cat"><select aria-label="Kategorie">${optHtml}</select><div class="vs" title="${esc(lvl)}">Vorschlag: ${esc(f.vs)} – ${esc(f.grund)}</div></div>
      <div class="note"><input type="text" placeholder="Notiz" value="${esc(noteOf(f))}" aria-label="Notiz"></div>
      <div class="prog"><i></i></div>
    </div>`;
  }
  $('list').innerHTML = html || '<div class="leer">Keine Treffer.</div>';
  for (const row of $('list').querySelectorAll('.row')) row.querySelector('select').value = catOf(byPath[row.dataset.p]);
  stat(list.length);
}
const byPath = Object.fromEntries(FILES.map(f => [f.path, f]));

function stat(shown) {
  const chg = FILES.filter(f => ST[f.path] && (ST[f.path].cat && ST[f.path].cat !== f.vs || ST[f.path].note)).length;
  const aus = FILES.filter(f => catOf(f) === 'Aussortiert').length;
  $('stat').innerHTML = `<b>${shown}</b> von ${FILES.length} · geändert <b>${chg}</b> · aussortiert ${aus}`;
}

function set(path, k, v) {
  const f = byPath[path];
  const e = ST[path] || (ST[path] = {});
  e[k] = v;
  if ((!e.cat || e.cat === f.vs) && !e.note) delete ST[path];
  store();
  const row = document.querySelector(`.row[data-p="${CSS.escape(path)}"]`);
  if (row) row.classList.toggle('chg', !!ST[path]);
  stat(document.querySelectorAll('#list .row').length);
}

// Abspielen: ein gemeinsames Audio-Element
const au = $('au');
let playing = null;
const srcOf = p => '../sound-quelle/' + p.split('/').map(encodeURIComponent).join('/');
function rowOf(p) { return document.querySelector(`.row[data-p="${CSS.escape(p)}"]`); }
function stop() {
  au.pause();
  const r = playing && rowOf(playing);
  if (r) { r.classList.remove('play'); r.querySelector('.pl').textContent = '▶'; }
  playing = null;
}
function play(p) {
  stop();
  playing = p;
  au.src = srcOf(p);
  const r = rowOf(p);
  if (r) { r.classList.add('play'); r.querySelector('.pl').textContent = '■'; r.querySelector('.prog i').style.width = '0'; }
  au.play().catch(err => { if (playing === p) { stop(); flash(p, 'Abspielen geht nicht: ' + err.message); } });
}
function flash(p, msg) { const r = rowOf(p); if (r) { const d = r.querySelector('.vs'); d.textContent = msg; d.style.color = '#e88'; } }
au.addEventListener('timeupdate', () => {
  const r = playing && rowOf(playing);
  if (r && au.duration) r.querySelector('.prog i').style.width = (au.currentTime / au.duration * 100) + '%';
});
au.addEventListener('ended', () => {
  const p = playing; stop();
  if ($('auto').checked) {
    const rows = [...document.querySelectorAll('#list .row')];
    const i = rows.findIndex(r => r.dataset.p === p);
    if (i >= 0 && rows[i + 1]) { rows[i + 1].scrollIntoView({ block: 'center', behavior: 'smooth' }); play(rows[i + 1].dataset.p); }
  }
});
au.addEventListener('error', () => { if (playing) { const p = playing; stop(); flash(p, 'Datei lässt sich im Browser nicht abspielen'); } });

$('list').addEventListener('click', e => {
  const b = e.target.closest('.pl'); if (!b) return;
  const p = b.closest('.row').dataset.p;
  if (playing === p) stop(); else play(p);
});
$('list').addEventListener('change', e => {
  if (e.target.tagName === 'SELECT') set(e.target.closest('.row').dataset.p, 'cat', e.target.value);
});
$('list').addEventListener('input', e => {
  if (e.target.tagName === 'INPUT') set(e.target.closest('.row').dataset.p, 'note', e.target.value.trim() ? e.target.value : '');
});
for (const id of ['q', 'fcat', 'sort', 'fhint']) $(id).addEventListener(id === 'q' ? 'input' : 'change', render);

$('save').addEventListener('click', () => {
  const out = {
    erstellt: new Date().toISOString(), quelle: 'sound-quelle/', anzahl: FILES.length,
    dateien: FILES.map(f => ({
      datei: f.path, kategorie: catOf(f), vorschlag: f.vs, notiz: noteOf(f),
      quelle: f.q.text, quelle_url: f.q.url || null, anbieter: f.q.anbieter,
      laenge_s: f.m.dur, groesse_mb: Math.round(f.m.size / 1e5) / 10, spitze_db: f.m.peak, mittel_db: f.m.rms,
      hinweise: f.hints.map(h => h[0]),
    })),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sound-liste.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('reset').addEventListener('click', () => {
  if (!confirm('Alle Auswahlen und Notizen auf den Vorschlag zurücksetzen?')) return;
  ST = {}; store(); render();
});

render();
</script>
</body>
</html>
